<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel AI Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">Ultra Travels</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Tours</a>
      <a href="#">Visa</a>
      <a href="#">Blogs</a>
      <button class="login-btn">Login / Signup</button>
    </nav>
  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="hero-text">
      <h1>GET THE VISA.<br>WITHOUT ANY STRESS.</h1>
      <p>Your AI-powered travel guide for trips, visas and planning.</p>
    </div>
  </section>

  <!-- AI CHAT BOX -->
  <!-- AI CHAT ASSISTANT -->
<div class="ai-chat">
  <div class="ai-header">
    <span class="ai-dot"></span>
    <span class="ai-title">Travel AI Assistant</span>
  </div>

  <div id="messages" class="ai-messages"></div>

  <div class="ai-input">
    <input id="input" placeholder="Ask about trips, visas, destinations…" />
    <button id="send">
      <span>➜</span>
    </button>
  </div>
</div>


  <script src="script.js"></script>
</body>
</html>
